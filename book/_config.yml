# Jupyter Book configuration (https://jupyterbook.org/customize/config.html)
title: Sea-ice velocity from sparse observations
author: Lauren Hoffman — OAISIS
logo: ""
copyright: "2026"
only_build_toc_files: true

execute:
  execute_notebooks: cache        # re-run a page only when its code changes
  cache: ""                      # default: book/_build/.jupyter_cache
  timeout: -1                     # the observing system page retrains the network ~50 times (10-15 min on CPU)
  allow_errors: false

parse:
  myst_enable_extensions:
    - dollarmath
    - colon_fence
    - linkify

html:
  use_repository_button: true
  use_issues_button: false
  use_edit_page_button: false
  home_page_in_navbar: true

repository:
  url: https://github.com/lahoffman/ml-tutorial-OAISIS
  path_to_book: book
  branch: main

launch_buttons:
  notebook_interface: jupyterlab
  binderhub_url: https://mybinder.org
  thebe: true                     # "Live Code": run and edit the cells on the page, on a Binder kernel of one's own

sphinx:
  config:
    html_show_copyright: false
    myst_heading_anchors: 2
    nb_merge_streams: true
    suppress_warnings: ["mystnb.unknown_mime_type"]
